# @package _global_
defaults:
  - data: eICU
  - model: tfm_sde

wandb_logging: true
wandb_project: clinical_trajectory
wandb_dir: wandb_log/
ckpt_dir: checkpoints/
results_dir: results/
resume_ckpt_path: null
max_epochs: 200
max_time: 00:48:00:00
check_val_every_n_epoch: 10
skip_training: false
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
num_sanity_val_steps: 2
mode: None 
seed: 42
